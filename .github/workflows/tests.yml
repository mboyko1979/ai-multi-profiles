name: Tests

on:
  schedule:
    # 06:00 UTC daily. Scheduled runs use the workflow on the default branch.
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run check
        env:
          GRADLE_OPTS: -Dorg.gradle.java.installations.paths=${{ env.JAVA_HOME_21_X64 }}:${{ env.JAVA_HOME_25_X64 }}
        run: ./gradlew check --stacktrace
